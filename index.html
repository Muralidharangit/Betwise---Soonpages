<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04103a">
  <title>Betwise – We'll Be Back Soon</title>
  <meta name="description" content="Betwise is currently undergoing maintenance. We'll be back shortly!">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preload" as="image" href="logo-web.png">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,400;1,500;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bw-navy: #04103a;
      --bw-navy-2: #0a1f6b;
      --bw-blue: #1e5bff;
      --bw-blue-glow: #2f7bff;
      --bw-green: #3be35a;
      --bw-green-2: #19c43c;
      --bw-text: #e8eeff;
      /* fluid unit: scales with width but never overflows short screens */
      --u: min(1vw, 1.9vh);
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: var(--bw-text);
      background: var(--bw-navy);
      overflow-x: hidden;
    }

    /* ---------- Background ---------- */
    .bw-stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 60% 55% at 72% 45%, rgba(47,123,255,.45), transparent 70%),
        radial-gradient(ellipse 50% 60% at 20% 45%, rgba(30,70,200,.35), transparent 70%),
        linear-gradient(160deg, #061a5c 0%, #04103a 55%, #020a26 100%);
    }

    .bw-dots {
      position: absolute; width: 360px; height: 160px; pointer-events: none;
      background-image: radial-gradient(rgba(59,227,90,.55) 1.6px, transparent 2px);
      background-size: 18px 18px;
      -webkit-mask-image: linear-gradient(90deg, #000, transparent);
              mask-image: linear-gradient(90deg, #000, transparent);
    }
    .bw-dots.tl { top: 0; left: 0; }
    .bw-dots.tr {
      top: 0; right: 0;
      background-image: radial-gradient(rgba(120,160,255,.35) 1.4px, transparent 2px);
      -webkit-mask-image: linear-gradient(270deg, #000, transparent);
              mask-image: linear-gradient(270deg, #000, transparent);
    }

    .bw-wave { position: absolute; left: 0; width: 100%; pointer-events: none; }
    .bw-wave.top { top: 0; height: min(45%, 420px); }
    .bw-wave.bottom { bottom: 0; height: min(30%, 280px); }

    .bw-content {
      position: relative; z-index: 2;
      width: 100%; max-width: 1760px; margin-inline: auto;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    /* ---------- Logo ---------- */
    .bw-logo {
      width: clamp(150px, calc(var(--u) * 24), 520px);
      height: auto;
      /* logo PNG already carries its own shadow */
    }

    /* ---------- Pills ---------- */
    .bw-divider {
      flex: 1 1 0; max-width: calc(var(--u) * 9); min-width: 16px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--bw-green));
      opacity: .8;
    }
    .bw-divider.rev { background: linear-gradient(90deg, var(--bw-green), transparent); }

    .bw-pill {
      display: inline-flex; align-items: center; gap: .75rem;
      padding: .65em 1.8em;
      border-radius: 50rem;
      border: 2px solid rgba(80,140,255,.85);
      background: linear-gradient(180deg, rgba(10,30,100,.7), rgba(4,16,58,.85));
      box-shadow: 0 0 18px rgba(47,123,255,.45), inset 0 0 14px rgba(47,123,255,.25);
      font-weight: 500;
      font-size: clamp(.85rem, calc(var(--u) * 1.4), 1.75rem);
      white-space: nowrap;
    }
    .bw-pill .bi { font-size: 1.5em; line-height: 1; }
    .bw-pill.green-edge { border-color: rgba(70,150,255,.8); }

    /* ---------- Headline ---------- */
    .bw-title {
      font-weight: 900; font-style: italic;
      line-height: .95;
      letter-spacing: -.02em;
      font-size: clamp(2.2rem, calc(var(--u) * 6.4), 7.6rem);
      margin: 0;
      white-space: nowrap;
    }
    .bw-title .white {
      background: linear-gradient(180deg, #ffffff 40%, #c9d4ec 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
    }
    .bw-title .green {
      background: linear-gradient(180deg, #7dff7a 0%, #3be35a 45%, #14b833 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 14px rgba(59,227,90,.45)) drop-shadow(0 6px 10px rgba(0,0,0,.45));
      padding-right: .08em;
    }
    .bw-title-line {
      height: 3px; margin: .9em auto 1.2em; width: 90%; font-size: clamp(1rem, calc(var(--u) * 1.4), 1.8rem);
      background: linear-gradient(90deg, transparent, var(--bw-blue-glow) 30%, var(--bw-green) 55%, transparent);
      box-shadow: 0 0 12px rgba(59,227,90,.7);
    }

    .bw-lead {
      font-size: clamp(.95rem, calc(var(--u) * 1.45), 1.9rem);
      font-weight: 500; line-height: 1.4; color: #f2f5ff;
    }
    .bw-later {
      font-style: italic; color: #b9c8f2;
      font-size: clamp(.9rem, calc(var(--u) * 1.3), 1.7rem);
      white-space: nowrap;
    }
    .bw-thanks {
      font-style: italic; color: #d4ddf7;
      font-size: clamp(.85rem, calc(var(--u) * 1.25), 1.6rem);
    }
    .bw-thanks .bi { color: var(--bw-green); }

    /* ---------- Illustration ---------- */
    .bw-art { width: 100%; max-width: calc(var(--u) * 50); max-height: 66vh; height: auto; overflow: visible; display: block; margin-inline: auto; }
    .bw-float { animation: bwFloat 5s ease-in-out infinite; }
    .bw-suit { animation: bwFloat 6s ease-in-out infinite; }
    .bw-suit.s2 { animation-delay: -1.5s; }
    .bw-suit.s3 { animation-delay: -3s; }
    .bw-suit.s4 { animation-delay: -4.5s; }
    .bw-gear { transform-origin: 625px 330px; animation: bwSpin 18s linear infinite; }
    @keyframes bwFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes bwSpin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .bw-float, .bw-suit, .bw-gear { animation: none; }
    }

    /* Tablets & phones (portrait): stacked layout */
    @media (max-width: 991.98px) {
      :root { --u: 1vw; }
      .bw-art { max-width: min(560px, 100%); max-height: none; }
      .bw-title { font-size: clamp(2.2rem, 9vw, 5rem); }
      .bw-lead { font-size: clamp(.95rem, 2.4vw, 1.25rem); }
      .bw-pill { font-size: clamp(.85rem, 2.2vw, 1.1rem); }
      .bw-later { font-size: clamp(.9rem, 2.2vw, 1.15rem); }
      .bw-thanks { font-size: clamp(.85rem, 2vw, 1.05rem); }
      .bw-divider { max-width: 90px; }
      .bw-logo { width: clamp(150px, 34vw, 280px); }
    }
    @media (max-width: 575.98px) {
      .bw-art { max-width: 400px; }
      .bw-pill { padding: .6em 1.25em; gap: .55rem; }
      .bw-divider { max-width: 36px; }
      .bw-lead br { display: none; }
    }
    @media (max-width: 359.98px) {
      .bw-divider { display: none; }
      .bw-later { white-space: normal; }
    }

    /* Phones held sideways / short screens: keep two columns */
    @media (orientation: landscape) and (max-height: 560px) and (min-width: 560px) {
      :root { --u: min(1vw, 2vh); }
      .bw-col { flex: 0 0 auto; width: 50%; }
      .bw-logo { width: clamp(120px, 20vw, 220px); }
      .bw-title { font-size: clamp(1.8rem, 6.4vw, 3.6rem); }
      .bw-lead { font-size: clamp(.8rem, 1.7vw, 1rem); }
      .bw-pill { font-size: clamp(.75rem, 1.6vw, .95rem); }
      .bw-later, .bw-thanks { font-size: clamp(.75rem, 1.6vw, .95rem); }
      .bw-art { max-height: 72vh; max-width: 100%; }
      .bw-footer { margin-top: .5rem !important; }
    }
  </style>
</head>
<body>
  <main class="bw-stage d-flex flex-column">

    <!-- decorative background -->
    <div class="bw-dots tl" aria-hidden="true"></div>
    <div class="bw-dots tr" aria-hidden="true"></div>

    <svg class="bw-wave top" viewBox="0 0 1600 400" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="wTop" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#1e5bff" stop-opacity="0"/>
          <stop offset=".6" stop-color="#1e5bff" stop-opacity=".25"/>
          <stop offset="1" stop-color="#3be35a" stop-opacity=".95"/>
        </linearGradient>
      </defs>
      <path d="M700 0 C1050 120 1300 170 1600 0 L1600 0 Z" fill="url(#wTop)" opacity=".5"/>
      <path d="M1180 210 C1360 170 1500 90 1600 0 L1600 140 C1480 220 1330 240 1180 210 Z" fill="url(#wTop)"/>
    </svg>

    <svg class="bw-wave bottom" viewBox="0 0 1600 300" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="wBot1" x1="0" x2="1">
          <stop offset="0" stop-color="#2f7bff"/>
          <stop offset=".5" stop-color="#1e5bff" stop-opacity=".3"/>
          <stop offset="1" stop-color="#3be35a"/>
        </linearGradient>
        <linearGradient id="wBot2" x1="0" x2="1">
          <stop offset="0" stop-color="#0a2a9a"/>
          <stop offset=".55" stop-color="#06185a"/>
          <stop offset="1" stop-color="#19c43c"/>
        </linearGradient>
      </defs>
      <path d="M0 120 C300 190 500 270 800 270 C1100 270 1350 160 1600 90 L1600 300 L0 300 Z" fill="url(#wBot2)" opacity=".85"/>
      <path d="M0 110 C300 180 520 262 800 262 C1100 262 1350 150 1600 80" fill="none" stroke="url(#wBot1)" stroke-width="5"/>
      <path d="M0 190 C350 250 600 300 900 300 L0 300 Z" fill="#2f7bff" opacity=".35"/>
    </svg>

    <!-- content -->
    <div class="bw-content flex-grow-1 d-flex flex-column">

      <!-- logo -->
      <header class="bw-header text-center mt-1 mt-lg-3 mb-3 mb-lg-2">
        <img src="logo-web.png" alt="Betwise" class="bw-logo" width="1000" height="223" fetchpriority="high">
      </header>

      <div class="row align-items-center align-content-center flex-grow-1 g-3 g-lg-4 mx-0">

        <!-- left column -->
        <section class="bw-col col-12 col-lg-6 text-center">
          <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
            <span class="bw-divider"></span>
            <span class="bw-pill"><i aria-hidden="true" class="bi bi-gear-fill"></i> Site Under Maintenance</span>
            <span class="bw-divider rev"></span>
          </div>

          <h1 class="bw-title">
            <span class="white">We’ll Be</span><br>
            <span class="green">Back</span> <span class="white">Soon!</span>
          </h1>
          <div class="bw-title-line"></div>

          <p class="bw-lead mb-3">
            Our website is currently undergoing maintenance<br class="d-none d-md-inline">
            to bring you a better and smoother experience.
          </p>

          <div class="d-flex align-items-center justify-content-center gap-3">
            <span class="bw-divider"></span>
            <span class="bw-later">Please check back later.</span>
            <span class="bw-divider rev"></span>
          </div>
        </section>

        <!-- right column: illustration -->
        <section class="bw-col col-12 col-lg-6 text-center" aria-hidden="true">
          <svg class="bw-art" viewBox="300 60 650 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1b2f8a"/>
                <stop offset="1" stop-color="#0a1648"/>
              </linearGradient>
              <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3a6bff"/>
                <stop offset="1" stop-color="#0d2a9a"/>
              </linearGradient>
              <linearGradient id="gearG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="1" stop-color="#9fb3e6"/>
              </linearGradient>
              <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8bff7e"/>
                <stop offset="1" stop-color="#18b93a"/>
              </linearGradient>
              <linearGradient id="padG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1c2a66"/>
                <stop offset="1" stop-color="#070f33"/>
              </linearGradient>
              <linearGradient id="podG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1747d1"/>
                <stop offset="1" stop-color="#061a5c"/>
              </linearGradient>
              <radialGradient id="halo" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/>
                <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
              </radialGradient>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- halo -->
            <circle cx="625" cy="340" r="300" fill="url(#halo)"/>

            <!-- podium -->
            <ellipse cx="625" cy="560" rx="300" ry="62" fill="none" stroke="#2f7bff" stroke-width="4" filter="url(#glow)" opacity=".9"/>
            <ellipse cx="625" cy="548" rx="270" ry="52" fill="url(#podG)"/>
            <path d="M355 548 v22 a270 52 0 0 0 540 0 v-22" fill="#081a5e"/>
            <ellipse cx="625" cy="572" rx="268" ry="48" fill="none" stroke="#3be35a" stroke-width="4" filter="url(#glow)" stroke-dasharray="0 120 420 2000"/>
            <ellipse cx="625" cy="540" rx="220" ry="38" fill="none" stroke="#5a8cff" stroke-width="2" opacity=".8"/>
            <ellipse cx="625" cy="536" rx="180" ry="28" fill="#0d2a9a" opacity=".7"/>

            <g class="bw-float">
              <!-- orbit ring (back half) -->
              <ellipse cx="625" cy="330" rx="300" ry="85" transform="rotate(-10 625 330)" fill="none" stroke="#3b8bff" stroke-width="2" opacity=".45"/>

              <!-- monitor -->
              <path d="M680 515 l70 -20 l60 18 l-70 22 z" fill="#0b2170"/>
              <g transform="skewY(-4)">
                <rect x="420" y="160" width="410" height="350" rx="26" fill="url(#bezel)" filter="url(#softGlow)"/>
                <rect x="436" y="176" width="378" height="318" rx="16" fill="url(#screen)"/>
                <path d="M436 176 h378 v80 L436 380 z" fill="#ffffff" opacity=".05"/>
              </g>

              <!-- gear + tools -->
              <g class="bw-gear">
                <path fill="url(#gearG)" filter="url(#softGlow)" d="
                  M625 220
                  l14 0 l6 30 a84 84 0 0 1 20 8 l25 -17 l20 20 l-17 25 a84 84 0 0 1 8 20 l30 6 l0 28 l-30 6 a84 84 0 0 1 -8 20 l17 25 l-20 20 l-25 -17 a84 84 0 0 1 -20 8 l-6 30 l-28 0 l-6 -30 a84 84 0 0 1 -20 -8 l-25 17 l-20 -20 l17 -25 a84 84 0 0 1 -8 -20 l-30 -6 l0 -28 l30 -6 a84 84 0 0 1 8 -20 l-17 -25 l20 -20 l25 17 a84 84 0 0 1 20 -8 l6 -30 z"/>
              </g>
              <circle cx="625" cy="334" r="62" fill="#14266e"/>
              <circle cx="625" cy="334" r="62" fill="none" stroke="#c9d6ff" stroke-width="3" opacity=".5"/>
              <!-- screwdriver -->
              <g transform="rotate(45 625 334)">
                <rect x="617" y="282" width="16" height="44" rx="6" fill="#ffffff"/>
                <rect x="621" y="326" width="8" height="46" rx="2" fill="#dbe4ff"/>
                <path d="M621 372 h8 l-4 12 z" fill="#dbe4ff"/>
              </g>
              <!-- wrench -->
              <g transform="rotate(-45 625 334)">
                <rect x="618" y="296" width="14" height="82" rx="7" fill="url(#greenG)"/>
                <circle cx="625" cy="290" r="20" fill="url(#greenG)"/>
                <rect x="618" y="268" width="14" height="22" rx="2" fill="#14266e"/>
                <circle cx="625" cy="370" r="3.5" fill="#0d6b22"/>
              </g>

              <!-- orbit ring (front half) -->
              <ellipse cx="625" cy="330" rx="300" ry="85" transform="rotate(-10 625 330)" fill="none" stroke="#3be35a" stroke-width="4" filter="url(#glow)" stroke-dasharray="560 2000" stroke-dashoffset="-60"/>

              <!-- controller -->
              <g transform="translate(625 470)">
                <path fill="url(#padG)" stroke="#2f5bd6" stroke-width="3" d="
                  M-150 -40 C-130 -70 -80 -66 -60 -58 L60 -58 C80 -66 130 -70 150 -40
                  C175 0 185 70 160 92 C140 110 112 96 95 70 L75 44 L-75 44 L-95 70
                  C-112 96 -140 110 -160 92 C-185 70 -175 0 -150 -40 Z"/>
                <rect x="-48" y="-52" width="96" height="36" rx="10" fill="#0d1a4f" stroke="#2a4fbf" stroke-width="2"/>
                <!-- d-pad -->
                <g fill="#3b6fff" filter="url(#softGlow)">
                  <rect x="-128" y="-30" width="18" height="52" rx="4"/>
                  <rect x="-145" y="-13" width="52" height="18" rx="4"/>
                </g>
                <!-- buttons -->
                <g fill="#3be35a" filter="url(#softGlow)">
                  <circle cx="115" cy="-28" r="9"/>
                  <circle cx="137" cy="-6" r="9"/>
                  <circle cx="93" cy="-6" r="9"/>
                  <circle cx="115" cy="16" r="9"/>
                </g>
                <!-- sticks -->
                <circle cx="-55" cy="30" r="26" fill="#0a1440" stroke="#2f7bff" stroke-width="4" filter="url(#softGlow)"/>
                <circle cx="-55" cy="30" r="15" fill="#1b2a66"/>
                <circle cx="55" cy="30" r="26" fill="#0a1440" stroke="#3be35a" stroke-width="4" filter="url(#softGlow)"/>
                <circle cx="55" cy="30" r="15" fill="#1b2a66"/>
              </g>
            </g>

            <!-- card suits -->
            <g class="bw-suit">
              <path transform="translate(372 120) scale(1.5)" fill="#0f2a86" stroke="#6fa0ff" stroke-width="2" d="M20 0 C28 12 40 18 40 30 C40 40 28 44 22 36 C22 42 25 48 30 50 L10 50 C15 48 18 42 18 36 C12 44 0 40 0 30 C0 18 12 12 20 0 Z"/>
            </g>
            <g class="bw-suit s2">
              <path transform="translate(330 270) scale(1.1)" fill="url(#greenG)" filter="url(#softGlow)" d="M20 36 C6 26 0 18 0 10 C0 3 6 -1 12 0 C16 1 19 4 20 7 C21 4 24 1 28 0 C34 -1 40 3 40 10 C40 18 34 26 20 36 Z"/>
              <path transform="translate(375 470) scale(1)" fill="url(#greenG)" filter="url(#softGlow)" d="M20 0 a10 10 0 0 1 9 15 a10 10 0 1 1 -3 15 l3 12 h-18 l3 -12 a10 10 0 1 1 -3 -15 a10 10 0 0 1 9 -15 z"/>
            </g>
            <g class="bw-suit s3">
              <path transform="translate(880 110) scale(1.2)" fill="url(#greenG)" filter="url(#softGlow)" d="M20 36 C6 26 0 18 0 10 C0 3 6 -1 12 0 C16 1 19 4 20 7 C21 4 24 1 28 0 C34 -1 40 3 40 10 C40 18 34 26 20 36 Z"/>
              <path transform="translate(895 340) scale(1.3)" fill="#0f2a86" stroke="#6fa0ff" stroke-width="2" d="M20 0 a10 10 0 0 1 9 15 a10 10 0 1 1 -3 15 l3 12 h-18 l3 -12 a10 10 0 1 1 -3 -15 a10 10 0 0 1 9 -15 z"/>
            </g>
            <g class="bw-suit s4">
              <path transform="translate(880 445) rotate(20)" fill="url(#greenG)" filter="url(#softGlow)" d="M22 0 L44 32 L22 64 L0 32 Z"/>
            </g>
          </svg>
        </section>
      </div>

      <!-- footer -->
      <footer class="bw-footer text-center mt-4 mt-lg-2">
        <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
          <span class="bw-divider" ></span>
          <span class="bw-pill"><i aria-hidden="true" class="bi bi-clock" style="color:var(--bw-green)"></i> We’ll be back shortly!</span>
          <span class="bw-divider rev" ></span>
        </div>
        <p class="bw-thanks mb-0">Thank you for your patience! <i aria-hidden="true" class="bi bi-heart"></i></p>
      </footer>
    </div>
  </main>
</body>
</html>
